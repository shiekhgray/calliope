location ^~ /calliope/api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow streaming responses to flow through without buffering
    proxy_buffering off;

    # Support byte-range requests for audio seeking
    proxy_force_ranges on;

    # Large uploads for music import (zip files up to ~600 MB)
    client_max_body_size 600M;
    proxy_read_timeout 120s;
}

# Bare /calliope (no trailing slash) would hit Vite's base-URL warning page.
# Redirect to /calliope/ so the app loads. Exact match wins over the ^~ prefix below.
location = /calliope {
    return 301 /calliope/;
}

location ^~ /calliope {
    proxy_pass http://127.0.0.1:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support for Vite HMR
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
