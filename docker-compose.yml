version: "2.2"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: calliope
      POSTGRES_USER: calliope
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calliope"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web/src:/app/src

  api:
    build: ./api
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://calliope:${DB_PASSWORD}@db:5432/calliope
      SECRET_KEY: ${SECRET_KEY}
      MUSIC_ROOT: /music
    volumes:
      - /backup/calliope/music:/music
    ports:
      - "127.0.0.1:8000:8000"

  indexer:
    build: ./indexer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://calliope:${DB_PASSWORD}@db:5432/calliope
      MUSIC_ROOT: /music
    volumes:
      - /backup/calliope/music:/music:ro
      - indexer_data:/data

volumes:
  pg_data:
  indexer_data:
